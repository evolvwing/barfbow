[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barfbow"
version = "1.0.0"
description = "Design OKLCh color palettes in an interactive Shiny laboratory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "shiny>=1.7",
]

[project.scripts]
barfbow = "barfbow:main"

[tool.setuptools]
py-modules = ["barfbow"]
