[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barfbow"
version = "0.1.0"
description = "Generate OKLCh color palettes with color-vision simulation previews."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
]

[project.scripts]
barfbow = "barfbow:main"

[tool.setuptools]
py-modules = ["barfbow"]
